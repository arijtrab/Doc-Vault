name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks - historique complet, valeurs masquees
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 detect -v \
            --source /repo --redact --exit-code 1 --log-opts="HEAD" \
            --report-format json --report-path /repo/gitleaks.json

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Semgrep - bloque sur severite ERROR
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --severity ERROR \
            --error --metrics=off \
            --json-output=semgrep.json \
            backend database security frontend/src

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore
